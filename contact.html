<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vallet Her - Contact Us</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
  }

  /* ===== HERO ===== */
  header.hero {
    position: relative;
    overflow: hidden;
    min-height: clamp(240px, 40vh, 520px);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: url("vallether_banner1.png") center top / contain no-repeat;
    background-color: #5A2A5D;
  }

  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.20);
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 1;
    padding: 28px 18px;
    max-width: 900px;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeInUp 900ms ease-out forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .hero h1 {
    margin: 0 0 6px;
    font-size: clamp(26px, 4vw, 42px);
    text-shadow: 0 4px 12px rgba(0,0,0,0.6);
  }

  .hero p {
    margin: 0;
    font-size: clamp(14px, 2vw, 18px);
    opacity: 0.95;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  /* Wave bottom */
  .hero-wave {
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    width: 100%;
    height: 80px;
    z-index: 2;
    pointer-events: none;
  }

  /* Top buttons */
  .hero-actions {
    position: absolute;
    top: 14px;
    right: 14px;
    z-index: 3;
    display: flex;
    gap: 10px;
    align-items: center;
  }

  .cta-btn {
    display: inline-block;
    padding: 10px 14px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 14px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    user-select: none;
  }

  .cta-primary {
    background: #ffffff;
    color: #0b4aa2;
  }

  .cta-secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.45);
  }

  .cta-primary:hover,
  .cta-secondary:hover {
    transform: translateY(-1px);
  }

  /* Logo */
  .hero-logo {
    position: absolute;
    top: 20px;
    left: 20px;
    height: 60px;
    width: auto;
    z-index: 4;
  }

  @media (max-width: 600px) {
    .hero-logo {
      height: 45px;
      top: 12px;
      left: 12px;
    }
  }

  /* ===== CONTENT ===== */
  section {
    padding: 60px 20px;
    max-width: 700px;
    margin: auto;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, textarea {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
  }

  button {
    background: #5A2A5D;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #4a214b;
  }

  #status {
    font-weight: bold;
  }
  </style>
</head>

<body>

<header class="hero">

  <img src="vallether_logo.jpg" alt="Vallet Her Logo" class="hero-logo">

  <div class="hero-actions">
    <a class="cta-btn cta-secondary" href="index.html">Home</a>
    <a class="cta-btn cta-primary" href="index.html#request">Request Service</a>
  </div>

  <div class="hero-content">
    <h1>Contact Us</h1>
    <p>We’re here to help. Send us a message.</p>
  </div>

  <!-- Same wave style -->
  <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#f4f6f8"
      d="M0,64 C240,110 480,110 720,64 C960,18 1200,18 1440,64 L1440,120 L0,120 Z"></path>
  </svg>

</header>

<section>
  <h2>Contact Form</h2>

  <form id="contactForm">
    <input name="full_name" placeholder="Full Name" required />
    <input name="email" placeholder="Email (optional)" />
    <input name="phone" placeholder="Phone (optional)" />
    <textarea name="message" placeholder="Your message" required></textarea>

    <div style="position:absolute; left:-9999px;">
      <input name="website" />
    </div>

    <button type="submit">Send Message</button>
    <p id="status"></p>
  </form>
</section>

<script>
  const ENDPOINT = "https://dumvqkxewqgckboohtft.supabase.co/functions/v1/super-function";

  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const status = document.getElementById("status");
    status.textContent = "Sending...";

    const data = Object.fromEntries(new FormData(form).entries());
    data.source = "contact_page";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      if (!res.ok) throw new Error("Submission failed");

      form.reset();
      status.textContent = "Thanks! Your message has been sent.";
    } catch (err) {
      status.textContent = "Something went wrong. Please try again.";
    }
  });
</script>

</body>
</html>
