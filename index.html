<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vallet Her - Trash Pickup Services</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f6f8;
  }

  /* ===== HERO / BANNER ===== */
  header.hero {
    position: relative;
    overflow: hidden;
    min-height: clamp(240px, 40vh, 520px);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: url("vallether_banner1.png") center top / contain no-repeat;
    background-color: #5A2A5D;
  }

  header.hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.20);
    z-index: 0;
  }

  .hero h1 { text-shadow: 0 4px 12px rgba(0,0,0,0.6); }
  .hero p  { text-shadow: 0 2px 8px rgba(0,0,0,0.6); }

  .hero-content {
    position: relative;
    z-index: 1;
    padding: 32px 18px;
    max-width: 900px;
    opacity: 0;
    transform: translateY(14px);
    animation: fadeInUp 900ms ease-out forwards;
  }

  @keyframes fadeInUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .hero h1 {
    margin: 0 0 10px;
    font-size: clamp(28px, 4.2vw, 52px);
    line-height: 1.1;
    letter-spacing: 0.3px;
  }

  .hero p {
    margin: 0 0 18px;
    font-size: clamp(14px, 2vw, 20px);
    opacity: 0.95;
  }

  .cta-btn {
    display: inline-block;
    padding: 12px 18px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 150ms ease, background 150ms ease, border-color 150ms ease;
    user-select: none;
  }

  .cta-primary { background: #ffffff; color: #0b4aa2; }
  .cta-primary:hover { transform: translateY(-1px); }

  .cta-secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.45);
  }
  .cta-secondary:hover {
    transform: translateY(-1px);
    background: rgba(255,255,255,0.18);
  }

  .hero-wave {
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    width: 100%;
    height: 80px;
    z-index: 2;
    pointer-events: none;
  }

  section {
    padding: 40px 20px;
    max-width: 700px;
    margin: auto;
  }

  form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  input, textarea {
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    font-size: 16px;
  }

  button {
    background: #5A2A5D;
    color: white;
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover { background: #5A2A5D; }

  #status { font-weight: bold; }

 /* ===== Centered Tab Navigation ===== */
.hero-tabs {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 5;

  display: flex;
  gap: 0;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(6px);
  border-radius: 999px;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.35);
}

/* Tab buttons */
.hero-tabs a {
  padding: 10px 22px;
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  color: white;
  transition: all 0.25s ease;
}

/* Divider effect */
.hero-tabs a + a {
  border-left: 1px solid rgba(255,255,255,0.25);
}

/* Hover effect */
.hero-tabs a:hover {
  background: rgba(255,255,255,0.25);
}


  .hero-actions .cta-btn {
    padding: 10px 14px;
    font-size: 14px;
  }

  @media (max-width: 480px) {
    .hero-actions { top: 10px; right: 10px; gap: 8px; }
    .hero-actions .cta-btn { padding: 9px 12px; font-size: 13px; }
  }

  .hero-logo {
    position: absolute;
    top: 20px;
    left: 20px;
    height: 60px;
    width: auto;
    z-index: 4;
  }

  @media (max-width: 600px) {
    .hero-logo { height: 45px; top: 12px; left: 12px; }
  }
  </style>

</head>

<body>

<header class="hero" id="top">
  <img src="ValletHer_Logo2.png" alt="Vallet Her Logo" class="hero-logo">

<div class="hero-tabs">
  <a href="#request">Request Service</a>
  <a href="contact.html">Contact Us</a>
</div>


  <div class="hero-content">
    <h1>Vallet Her</h1>
    <h3>Clean trash, happy planet</h3>
  </div>

  <svg class="hero-wave" viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#f4f6f8" d="M0,64 C240,110 480,110 720,64 C960,18 1200,18 1440,64 L1440,120 L0,120 Z"></path>
  </svg>
</header>

<section id="request">
  <h2>Request Service</h2>

  <form id="contactForm">
    <input name="full_name" placeholder="Full Name" required />
    <input name="email" placeholder="Email (optional)" />
    <input name="phone" placeholder="Phone (optional)" />
    <input name="address" placeholder="Service Address" />
    <textarea name="message" placeholder="How can we help?" required></textarea>

    <div style="position:absolute; left:-9999px;">
      <input name="website" />
    </div>

    <button type="submit">Submit Request</button>
    <p id="status"></p>
  </form>
</section>

<script>
  const ENDPOINT = "https://dumvqkxewqgckboohtft.supabase.co/functions/v1/super-function";

  document.getElementById("contactForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.currentTarget;
    const status = document.getElementById("status");
    status.textContent = "Sending...";

    const data = Object.fromEntries(new FormData(form).entries());
    data.source = "website";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data),
      });

      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch { json = { raw: text }; }

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}: ${json.error || json.details || json.raw || "Unknown error"}`);
      }

      form.reset();
      status.textContent = "Thank you! We will contact you soon.";
    } catch (err) {
      status.textContent = "Error: " + (err?.message || err);
      console.error("Form submit error:", err);
    }
  });
</script>

<script>
  (function () {
    const hero = document.querySelector("header.hero");
    if (!hero) return;

    let ticking = false;
    function onScroll() {
      if (ticking) return;
      ticking = true;

      requestAnimationFrame(() => {
        const y = window.scrollY || 0;
        hero.style.backgroundPosition = `center ${Math.round(y * 0.10)}px`;
        ticking = false;
      });
    }

    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  })();
</script>
<footer style="
  background:#5A2A5D;
  color:white;
  text-align:center;
  padding:20px 10px;
  margin-top:60px;
  font-size:14px;
  letter-spacing:0.5px;
">
  © 2025 Vallet Her. All rights reserved.
</footer>

</body>
</html>
